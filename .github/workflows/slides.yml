# ============================================================
# ThinkLab Slides（Slidev）自动构建与发布
#
# 触发：docs/software/ 下的 slides.md / 资源 / 依赖发生变化，
#       或在 Actions 页面手动触发（workflow_dispatch）
# 产物：
#   1. GitHub Pages 在线幻灯片（slidev build → dist/）
#      访问地址：https://cuiningran-spec.github.io/philosophy-agent/
#   2. PDF 版本 Artifact（slidev export，保留 30 天，可下载）
#
# 说明：
#   - 首次使用需在仓库 Settings → Pages → Build and deployment
#     把 Source 设为 "GitHub Actions"（一次性操作）
#   - 仓库部署在路径 /philosophy-agent/ 下，build 时用 --base 指定，
#     否则页面资源会 404
# ============================================================
name: Build & Deploy Slides

on:
  push:
    branches: [main]
    paths:
      - "docs/software/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，新推送会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs/software

jobs:
  build:
    name: 构建幻灯片
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/software/package-lock.json

      - name: 安装 Pages 配置
        uses: actions/configure-pages@v5

      - name: 安装依赖
        run: npm install

      - name: 构建静态幻灯片（SPA）
        run: npm run build -- --base /philosophy-agent/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/software/dist

      - name: 导出 PDF（需要 Chromium）
        run: |
          npx playwright install chromium --with-deps
          npm run export -- --output thinklab-slides.pdf
        continue-on-error: true   # PDF 导出偶发超时不阻塞 Pages 发布

      - name: 上传 PDF Artifact
        if: hashFiles('docs/software/thinklab-slides.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: docs/software/thinklab-slides.pdf
          retention-days: 30

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
