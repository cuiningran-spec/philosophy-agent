# ============================================================
# ThinkLab 自动化测试配置（组员 A 维护）
# 运行目录：项目根目录 philosophy-agent/ —— 本文件所在目录即 pytest rootdir
# 业务代码位于 code/（core_engine、backend、frontend）
# ============================================================
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
    --ignore=tests/unit/test_app.py
    --ignore=tests/test_api_e2e.py
markers =
    unit: 单元测试（B 负责）
    integration: 输入校验与 API 集成测试（C 负责）
    e2e: 完整业务流程测试（D 负责）
filterwarnings =
    ignore::DeprecationWarning

# --ignore=tests/test_api_e2e.py 说明：
# 该文件由远端合并引入，导入的 create_ai_prompt_pipeline / celsius_to_fahrenheit /
# get_max_value 在后端 app 中不存在（旧课程模板遗留），会导致收集错误。
# 文件已保留，仅不参与收集；如确认无用可由团队决定移除。

# --ignore=tests/unit/test_app.py 说明：
# 该文件是早期课程模板遗留（配套的 app.py 与 ThinkLab 后端无关），
# 其 `from app import ...` 会与后端包 `app`（code/backend/app）模块名冲突，
# 导致收集错误且二者无法同时导入。文件本身未删除，仅不参与收集。

# ---- 覆盖率统计 ----
# --cov 的目标已确认：核心逻辑包名为 thinklab_core（位于 code/core_engine/thinklab_core）
# 覆盖率配置放在 .coveragerc（coverage.py 不读取 pytest.ini 中的 [coverage:*] 段）
# 注意：--cov 不放入 addopts，B/C/D 日常快速跑测试时不必每次计算覆盖率；
# 需要覆盖率时显式执行（命令见 tests/TEST_PLAN.md）
